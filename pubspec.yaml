name: petlo
description: "うちの子のすべて、家族とAIで見守る — A pet life log app"
publish_to: "none"

# Versioning: <major>.<minor>.<patch>+<build_number>
# build_numberはApp Store Connect / Google Play Consoleで自動増加させる
version: 1.0.0+47

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# ============================================================================
# 依存関係 (rev5.5仕様準拠)
# ============================================================================
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== Core =====
  cupertino_icons: ^1.0.8
  intl: any  # flutter_localizationsが固定するバージョンに従う

  # ===== State management =====
  # Riverpod (rev5.1で確定、currentGroupIdProvider等で全画面State管理)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ===== Local Database =====
  # drift (SQLite) - 全テーブルローカル管理
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ===== Networking =====
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # ===== Local Notifications =====
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # ===== Push Notifications =====
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ===== In-App Purchase =====
  # rev3で確定: RevenueCatは使わずStoreKit 2 / Google Play Billingを直接
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.3.18  # iOS用
  in_app_purchase_android: ^0.3.6+10  # Android用

  # ===== Charts =====
  # 体重/体温/食事量推移グラフ
  fl_chart: ^0.69.0

  # ===== Image processing =====
  # Exif削除 + 圧縮 (rev5でセキュリティ強化)
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2
  image: ^4.2.0
  # ペット写真トリミング(build 12)
  image_cropper: ^9.0.0

  # ===== Calendar (rev5.2新規) =====
  # 月表示UI + OSカレンダー連携
  table_calendar: ^3.1.2
  device_calendar: ^4.3.3
  add_2_calendar: ^3.0.1

  # ===== Onboarding (rev5.4新規) =====
  introduction_screen: ^3.1.14

  # ===== Permissions =====
  permission_handler: ^11.3.1

  # ===== URL/Sharing =====
  url_launcher: ^6.3.0
  share_plus: ^10.0.0

  # ===== Reviews =====
  in_app_review: ^2.0.9

  # ===== Backups (rev5.4) =====
  # iCloud Drive
  icloud_storage: ^2.2.0
  # Google Drive
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1
  archive: ^3.6.1  # ZIPバックアップ生成

  # ===== Home Widgets (rev5.4) =====
  home_widget: ^0.6.0

  # ===== Authentication =====
  sign_in_with_apple: ^6.1.2
  # google_sign_in は上で記載

  # ===== Storage =====
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # ===== Utilities =====
  collection: ^1.18.0
  uuid: ^4.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.4.0

# ============================================================================
# Dependency overrides
# Dart 3.10.4 SDK (Flutter 3.38.5) は _macros パッケージを提供しないため、
# 古い analyzer/analyzer_plugin が引き起こすビルド失敗を回避する。
# build_runner 2.5.x が引き込む analyzer_plugin 0.12.0 (analyzer ^7.0.0) は
# analyzer 7.6.0 と API ミスマッチがあるため、0.13.4 (analyzer ^7.5.1) を強制。
# ============================================================================
dependency_overrides:
  analyzer_plugin: 0.13.4

# ============================================================================
# 開発依存
# ============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ===== Code generation =====
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # ===== Linting / Formatting =====
  custom_lint: ^0.7.3
  riverpod_lint: ^2.3.13
  very_good_analysis: ^6.0.0

  # ===== Testing =====
  # テスト関連を充実させる(8ヶ月プロジェクトの保険)
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  alchemist: ^0.11.0  # ゴールデンテストの拡張
  network_image_mock: ^2.1.1
  bloc_test: ^9.1.7  # Riverpodでも使える便利なヘルパー

  # ===== Integration test =====
  integration_test:
    sdk: flutter

# ============================================================================
# Flutterリソース設定
# ============================================================================
flutter:
  uses-material-design: true
  generate: true  # L10n自動生成有効化

  # Assets
  assets:
    - assets/images/
    # TODO: アセット調達後に復活 — breeds マスタ JSON
    # - assets/data/breeds_dogs.json
    # - assets/data/breeds_cats.json

  # Fonts (rev5.3で確定: Fraunces + Manrope + JetBrains Mono + Noto SC fallback)
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont.ttf
        - asset: assets/fonts/Fraunces-Italic-VariableFont.ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    # 中国語フォールバック (rev5.3新規)
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 500
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700

# ============================================================================
# L10n設定
# ============================================================================
flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/l10n/generated
  main_locale: ja
  use_deferred_loading: false
