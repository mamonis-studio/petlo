# petlo - Lintルール
# very_good_analysis をベースに、petlo独自ルールを追加

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "lib/l10n/generated/**"
    - "build/**"
  errors:
    # Riverpod推奨設定
    invalid_annotation_target: ignore

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ===== petlo独自の厳格ルール =====

    # 必ず const を使う(パフォーマンス)
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # 型安全
    always_declare_return_types: true
    always_specify_types: false  # var使ってOKだが型注釈推奨

    # null safety
    avoid_null_checks_in_equality_operators: true
    prefer_null_aware_operators: true

    # 命名
    constant_identifier_names: true
    file_names: true
    library_names: true
    non_constant_identifier_names: true

    # ハードコード文字列禁止 (L10n強制) ← ただしテストでは許可
    # avoid_print: true は very_good_analysis で有効

    # ===== petloで重要なルール =====
    # rev5.3: ペット中心UIなので、グローバルState呼び出しは厳格に
    avoid_implementing_value_types: true
    avoid_setters_without_getters: true

    # rev5.5: プロンプトインジェクション対策
    # ユーザー入力を直接APIに渡さない方針を徹底
    avoid_dynamic_calls: true

    # ===== 緩和ルール =====
    public_member_api_docs: false  # 全部書くのは非現実的
    sort_constructors_first: false  # 自由
    diagnostic_describe_all_properties: false

# 注意:
# - lint違反は基本的にエラー扱い、CI/CDで`flutter analyze --fatal-infos`を実行
# - とはいえ過度に厳しくしないため、very_good_analysis の標準を採用
